# Säkerhetsheaders för allt nginx serverar. Inkluderas i VARJE location som har egna
# add_header-rader – nginx ärver nämligen inte add_header från server-blocket så fort
# en location har en egen. Glömmer man en location saknar den alla headers.

# Content Security Policy: vilka källor browsern får ladda och köra. Vite bygger utan inline-
# skript, så 'self' räcker: ett skript en angripare lyckats få in på sidan (XSS) kan varken
# hämtas från en annan domän eller köras inline, och fetch() når bara vår egen origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Browsern får inte gissa filtyp (en uppladdad "bild" som egentligen är JavaScript körs inte)
add_header X-Content-Type-Options "nosniff" always;
# Sidan får inte visas i en iframe på någon annan sajt (clickjacking). Samma sak som frame-ancestors, för äldre browsers.
add_header X-Frame-Options "DENY" always;
# Skicka inte hela vår URL som Referer till andra sajter
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Appen använder varken kamera, mikrofon eller position – säg det
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS: browsern minns i ett år att den bara ska prata https med oss. Verkningslös över http
# (lokalt), och Render terminerar TLS framför oss – headern ska ändå komma från appen.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
